name: Build ForgeOS
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: forgeos
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Buildah or Podman via Build Image Action
        uses: redhat-actions/buildah-build@v3
        id: build-image
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          containerfiles: |
            ./Containerfile

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}/${{ github.repository_owner }}

      - name: Prune Old Image Versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /users/${{ github.repository_owner }}/packages/container/${{ env.IMAGE_NAME }}/versions \
            --paginate -q '.[].id' | tail -n +3 | xargs -I {} \
            gh api --method DELETE /users/${{ github.repository_owner }}/packages/container/${{ env.IMAGE_NAME }}/versions/{}

