name: Build Custom Silverblue Image
on:
  schedule:
    - cron: '0 0 * * *' # Builds automatically every day at midnight to catch upstream updates
  push:
    branches:
      - main # Builds instantly whenever you push a change
  workflow_dispatch: # Allows you to trigger a build manually with a single click

env:
  IMAGE_NAME: my-silverblue-extended # Rename this to whatever you want your image named
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Critical: allows the runner to publish to your GHCR profile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Buildah or Podman via Build Image Action
        uses: redhat-actions/buildah-build@v2
        id: build-image
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          containerfiles: |
            ./Containerfile # Points directly to your existing file

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub

      - name: Push Image to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}/${{ github.repository_owner }}

